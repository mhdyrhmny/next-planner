<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامه‌ریز من</title>
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#1c2733;--mute:#6b7886;--line:#dde3e9;--acc:#0f766e;--acc2:#e0f2ef;--brk:#2563eb;--warn:#b45309;--now:#fff7e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:18px}
nav{display:flex;gap:6px}
nav button{background:transparent;border:1px solid #ffffff44;color:#fff;padding:5px 16px;border-radius:8px}
nav button.on{background:#fff;color:var(--ink);border-color:#fff}
main{max-width:1100px;margin:16px auto;padding:0 12px;display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 10px;font-size:16px}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media(max-width:820px){main{grid-template-columns:1fr}.side{position:static;order:-1}}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar .t{flex:1;min-width:160px}
.bar .t b{font-size:18px;display:block}
.bar .t span{color:var(--mute);font-size:13px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
.btn:hover{background:var(--acc2)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.sum{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sum div{background:var(--acc2);border-radius:8px;padding:4px 12px;font-size:13px}
.slot{display:grid;grid-template-columns:48px 22px 1fr 30px;gap:8px;align-items:center;padding:3px 6px;border-bottom:1px solid var(--line)}
.slot.now{background:var(--now);border-radius:6px}
.slot .tm{color:var(--mute);font-size:13px;direction:ltr;text-align:right}
.slot input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.slot .tx{border:1px solid transparent;border-radius:6px;padding:5px 8px;background:transparent;width:100%}
.slot .tx:hover{border-color:var(--line)}
.slot .tx:focus{outline:2px solid var(--acc);background:#fff}
.slot.done .tx{text-decoration:line-through;color:var(--mute)}
.slot .go{border:0;background:transparent;color:var(--acc);font-size:15px;visibility:hidden}
.slot.has .go{visibility:visible}
.end{color:var(--mute);font-size:12px;padding:6px}
.timer{text-align:center}
.timer .mode{font-weight:700;color:var(--acc)}
.timer.brk .mode{color:var(--brk)}
.timer .clock{font-size:54px;font-weight:700;direction:ltr;letter-spacing:1px;line-height:1.2}
.timer .lbl{color:var(--mute);font-size:13px;min-height:20px}
.timer .row{display:flex;gap:8px;justify-content:center;margin-top:8px}
.set{display:flex;gap:6px;justify-content:center;margin-top:10px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.set label{display:flex;flex-direction:column;align-items:center;gap:2px}
.set input,.f input{width:52px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px}
.f{display:flex;gap:6px;margin-bottom:8px}
.f input.s{flex:1;width:auto;text-align:right}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.log button{border:0;background:none;color:var(--warn)}
.tot{font-weight:700;margin-top:8px}
.row7{display:grid;grid-template-columns:110px 1fr 70px 70px;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.row7:hover{background:var(--acc2)}
.row7.today{background:var(--now)}
.track{background:var(--bg);border-radius:6px;height:14px;overflow:hidden}
.fill{background:var(--acc);height:100%}
.prog{margin:8px 0 14px}
.prog .track{height:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid .h{text-align:center;color:var(--mute);font-size:12px}
.cell{min-height:62px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;cursor:pointer;background:#fff}
.cell b{font-size:14px;display:block}
.cell.today{outline:2px solid var(--warn)}
.cell.empty{border:0;cursor:default;background:transparent}
.foot{max-width:1100px;margin:0 auto 24px;padding:0 12px;display:flex;gap:8px;flex-wrap:wrap;color:var(--mute);font-size:12px;align-items:center}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>برنامه‌ریز من</h1>
  <nav>
    <button data-tab="day" class="on">امروز</button>
    <button data-tab="week">هفتگی</button>
    <button data-tab="month">ماهانه</button>
  </nav>
</header>

<main>
  <section id="view"></section>
  <aside class="side">
    <div class="card timer" id="timer">
      <h2>پومودورو</h2>
      <div class="mode" id="pmMode">تمرکز</div>
      <div class="clock" id="pmClock">25:00</div>
      <div class="lbl" id="pmLbl"></div>
      <div class="row">
        <button class="btn p" id="pmGo">شروع</button>
        <button class="btn" id="pmSkip">رد کردن</button>
        <button class="btn" id="pmReset">از نو</button>
      </div>
      <div class="set">
        <label>تمرکز<input type="number" min="1" id="sFocus"></label>
        <label>استراحت<input type="number" min="1" id="sBrk"></label>
        <label>استراحت بلند<input type="number" min="1" id="sLong"></label>
        <label>هر چند دوره<input type="number" min="2" id="sEvery"></label>
      </div>
    </div>
    <div class="card">
      <h2>ثبت ساعت مطالعه</h2>
      <div class="f">
        <input class="s" id="stName" placeholder="درس یا موضوع">
        <input id="stMin" type="number" min="1" placeholder="دقیقه">
        <button class="btn p" id="stAdd">ثبت</button>
      </div>
      <ul class="log" id="stList"></ul>
      <div class="tot" id="stTot"></div>
      <div class="lbl" style="color:var(--mute);font-size:12px">پایان هر دوره تمرکز پومودورو خودکار ثبت می‌شود.</div>
    </div>
  </aside>
</main>

<div class="foot">
  <span>اطلاعات فقط روی همین مرورگر ذخیره می‌شود.</span>
  <button class="btn" id="exp">دانلود نسخه پشتیبان</button>
  <button class="btn" id="imp">بازیابی از پشتیبان</button>
  <input type="file" id="impFile" accept=".json" class="hide">
</div>

<script>
const $=s=>document.querySelector(s);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const fmt=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
function J(d){const p={};fmt.formatToParts(d).forEach(x=>p[x.type]=x.value);return{y:+p.year,m:+p.month,d:+p.day}}
const iso=d=>d.toISOString().slice(0,10);
const addD=(d,n)=>new Date(d.getTime()+n*864e5);
const nowD=()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate(),12))};
const wi=d=>(d.getUTCDay()+1)%7;
const mStart=d=>addD(d,-(J(d).d-1));
const jt=d=>{const j=J(d);return fa(j.d)+' '+MN[j.m-1]+' '+fa(j.y)};
const pad=n=>String(n).padStart(2,'0');
const KEY='planner_v1';

let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db||{};
db.days=db.days||{};
db.set=Object.assign({focus:25,brk:5,long:15,every:4,wg:20,mg:80},db.set||{});
let saveFail=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){if(!saveFail){saveFail=true;alert('ذخیره‌سازی مرورگر در دسترس نیست. از دکمه «دانلود نسخه پشتیبان» استفاده کنید.')}}}
const day=k=>db.days[k]||(db.days[k]={s:{},st:[]});
const mins=k=>{const d=db.days[k];return d?d.st.reduce((a,x)=>a+x.m,0):0};
const taskStat=k=>{const d=db.days[k];let t=0,n=0;if(d)for(const s in d.s){if(d.s[s].t&&d.s[s].t.trim()){t++;if(d.s[s].d)n++}}return{t,n}};
const hrs=m=>{const h=Math.floor(m/60),r=m%60;return h?fa(h)+' ساعت'+(r?' و '+fa(r)+' دقیقه':''):fa(r)+' دقیقه'};
const hdec=m=>fa((m/60).toFixed(1).replace(/\.0$/,''));

let tab='day',cur=nowD(),wk=nowD(),mo=mStart(nowD());
const SLOTS=[];for(let i=0;i<36;i++)SLOTS.push(pad(6+(i>>1))+':'+(i%2?'30':'00'));

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='day')renderDay();else if(tab==='week')renderWeek();else renderMonth();
  renderLog();
}

function renderDay(){
  const k=iso(cur),dd=day(k),isToday=k===iso(nowD());
  const n=new Date(),nm=n.getHours()*60+n.getMinutes();
  const st=taskStat(k);
  let h=`<div class="card"><div class="bar">
    <button class="btn" data-a="dprev">قبلی</button>
    <div class="t"><b>${WD[wi(cur)]} ${jt(cur)}</b><span>${k}</span></div>
    <button class="btn" data-a="dtoday">امروز</button>
    <button class="btn" data-a="dnext">بعدی</button></div>
    <div class="sum"><div>کارهای انجام‌شده: ${fa(st.n)} از ${fa(st.t)}</div><div>مطالعه: ${hrs(mins(k))}</div></div>`;
  SLOTS.forEach((t,i)=>{
    const s=dd.s[t]||{t:'',d:false};
    const sm=(6+(i>>1))*60+(i%2)*30;
    const nowCls=isToday&&nm>=sm&&nm<sm+30?' now':'';
    const e=s.t&&s.t.trim()?' has':'';
    h+=`<div class="slot${nowCls}${s.d?' done':''}${e}" data-k="${t}">
      <span class="tm">${t}</span>
      <input type="checkbox" ${s.d?'checked':''} data-a="chk" aria-label="انجام شد">
      <input class="tx" value="${esc(s.t)}" placeholder="کاری تعریف کنید..." data-a="txt">
      <button class="go" data-a="go" title="شروع پومودورو برای این کار">▶</button></div>`;
  });
  h+=`<div class="end">پایان برنامه: ۲۴:۰۰</div></div>`;
  $('#view').innerHTML=h;
  const c=document.querySelector('.slot.now');if(c&&!window._sc){window._sc=1;c.scrollIntoView({block:'center'})}
}

function renderWeek(){
  const ws=addD(wk,-wi(wk));
  let tot=0,done=0,all=0,mx=120,rows='';
  const ds=[];for(let i=0;i<7;i++){const d=addD(ws,i);ds.push(d);mx=Math.max(mx,mins(iso(d)))}
  ds.forEach(d=>{
    const k=iso(d),m=mins(k),s=taskStat(k);tot+=m;done+=s.n;all+=s.t;
    rows+=`<div class="row7${k===iso(nowD())?' today':''}" data-a="open" data-d="${k}">
      <span>${WD[wi(d)]} ${fa(J(d).d)}</span>
      <div class="track"><div class="fill" style="width:${m/mx*100}%"></div></div>
      <span>${hdec(m)} ساعت</span><span>${fa(s.n)}/${fa(s.t)} کار</span></div>`;
  });
  const g=db.set.wg,pc=Math.min(100,tot/60/g*100);
  $('#view').innerHTML=`<div class="card"><div class="bar">
    <button class="btn" data-a="wprev">هفته قبل</button>
    <div class="t"><b>هفته ${jt(ds[0])} تا ${jt(ds[6])}</b><span>برای باز کردن هر روز روی آن بزنید</span></div>
    <button class="btn" data-a="wtoday">این هفته</button>
    <button class="btn" data-a="wnext">هفته بعد</button></div>
    <div class="sum"><div>مجموع مطالعه: ${hrs(tot)}</div><div>کارهای انجام‌شده: ${fa(done)} از ${fa(all)}</div></div>
    <div class="prog"><div>هدف هفتگی: <span class="f" style="display:inline-flex;margin:0"><input type="number" min="1" id="wg" value="${g}"></span> ساعت — ${fa(Math.round(pc))}٪ انجام شد</div>
    <div class="track"><div class="fill" style="width:${pc}%"></div></div></div>${rows}</div>`;
}

function renderMonth(){
  const nx=mStart(addD(mo,32)),len=Math.round((nx-mo)/864e5),j=J(mo);
  let tot=0,act=0,done=0,all=0,cells='',mx=60;
  for(let i=0;i<len;i++)mx=Math.max(mx,mins(iso(addD(mo,i))));
  for(let i=0;i<wi(mo);i++)cells+='<div class="cell empty"></div>';
  for(let i=0;i<len;i++){
    const d=addD(mo,i),k=iso(d),m=mins(k),s=taskStat(k);
    tot+=m;if(m)act++;done+=s.n;all+=s.t;
    const a=m?(0.15+0.6*m/mx):0;
    cells+=`<div class="cell${k===iso(nowD())?' today':''}" data-a="open" data-d="${k}" style="background:rgba(15,118,110,${a})">
      <b>${fa(i+1)}</b>${m?hdec(m)+' ساعت':''}${s.t?`<br>${fa(s.n)}/${fa(s.t)} کار`:''}</div>`;
  }
  const g=db.set.mg,pc=Math.min(100,tot/60/g*100);
  $('#view').innerHTML=`<div class="card"><div class="bar">
    <button class="btn" data-a="mprev">ماه قبل</button>
    <div class="t"><b>${MN[j.m-1]} ${fa(j.y)}</b><span>${fa(len)} روز</span></div>
    <button class="btn" data-a="mtoday">این ماه</button>
    <button class="btn" data-a="mnext">ماه بعد</button></div>
    <div class="sum"><div>مجموع مطالعه: ${hrs(tot)}</div><div>روزهای فعال: ${fa(act)}</div><div>کارهای انجام‌شده: ${fa(done)} از ${fa(all)}</div></div>
    <div class="prog"><div>هدف ماهانه: <span class="f" style="display:inline-flex;margin:0"><input type="number" min="1" id="mg" value="${g}"></span> ساعت — ${fa(Math.round(pc))}٪ انجام شد</div>
    <div class="track"><div class="fill" style="width:${pc}%"></div></div></div>
    <div class="grid">${WD.map(w=>`<div class="h">${w.replace('شنبه','ش').slice(0,w==='شنبه'?1:undefined)}</div>`).join('')}${cells}</div></div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

/* ---------- study log (always for the viewed day) ---------- */
function renderLog(){
  const k=iso(cur),d=day(k);
  $('#stList').innerHTML=d.st.length?d.st.map((x,i)=>`<li><span>${esc(x.s)||'مطالعه'} — ${hrs(x.m)}</span><button data-a="del" data-i="${i}" aria-label="حذف">حذف</button></li>`).join(''):'<li style="color:var(--mute)">برای این روز چیزی ثبت نشده.</li>';
  $('#stTot').textContent='مجموع '+jt(cur)+': '+hrs(mins(k));
}
$('#stAdd').onclick=()=>{
  const m=parseInt($('#stMin').value);if(!m||m<1){$('#stMin').focus();return}
  day(iso(cur)).st.push({s:$('#stName').value.trim(),m});
  $('#stMin').value='';save();render();
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='dprev')cur=addD(cur,-1);
  else if(a==='dnext')cur=addD(cur,1);
  else if(a==='dtoday')cur=nowD();
  else if(a==='wprev')wk=addD(wk,-7);
  else if(a==='wnext')wk=addD(wk,7);
  else if(a==='wtoday')wk=nowD();
  else if(a==='mprev')mo=mStart(addD(mo,-1));
  else if(a==='mnext')mo=mStart(addD(mo,32));
  else if(a==='mtoday')mo=mStart(nowD());
  else if(a==='open'){const p=el.dataset.d.split('-');cur=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12));tab='day';window._sc=1}
  else if(a==='del'){day(iso(cur)).st.splice(+el.dataset.i,1);save()}
  else if(a==='go'){const k=el.closest('.slot').dataset.k;pm.label=day(iso(cur)).s[k].t;if(!pm.run)toggle();else paint()}
  else if(a==='chk'){const k=el.closest('.slot').dataset.k,d=day(iso(cur));(d.s[k]=d.s[k]||{t:'',d:false}).d=el.checked;save()}
  else return;
  render();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.a==='txt'){
    const row=el.closest('.slot'),k=row.dataset.k,d=day(iso(cur));
    (d.s[k]=d.s[k]||{t:'',d:false}).t=el.value;
    row.classList.toggle('has',!!el.value.trim());save();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='wg'||el.id==='mg'){db.set[el.id]=Math.max(1,+el.value||1);save();render()}
});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});

/* ---------- pomodoro ---------- */
const pm={mode:'focus',left:db.set.focus*60,run:false,end:0,n:0,label:''};
const dur=m=>(m==='focus'?db.set.focus:m==='brk'?db.set.brk:db.set.long)*60;
function paint(){
  const m=Math.floor(pm.left/60),s=pm.left%60;
  $('#pmClock').textContent=pad(m)+':'+pad(s);
  $('#pmMode').textContent=pm.mode==='focus'?'تمرکز':pm.mode==='brk'?'استراحت کوتاه':'استراحت بلند';
  $('#timer').classList.toggle('brk',pm.mode!=='focus');
  $('#pmGo').textContent=pm.run?'توقف':'شروع';
  $('#pmLbl').textContent=pm.mode==='focus'&&pm.label?'روی: '+pm.label:'دوره‌های کامل امروز: '+fa(pm.n);
  document.title=(pm.run?pad(m)+':'+pad(s)+' — ':'')+'برنامه‌ریز من';
}
function toggle(){
  if(pm.run){pm.run=false}else{pm.run=true;pm.end=Date.now()+pm.left*1000}
  paint();
}
function beep(){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();
    [0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){}
}
function next(){
  if(pm.mode==='focus'){pm.n++;pm.mode=pm.n%db.set.every===0?'long':'brk'}else pm.mode='focus';
  pm.left=dur(pm.mode);pm.run=false;
}
function finish(){
  beep();
  if(pm.mode==='focus'){
    day(iso(nowD())).st.push({s:pm.label||'پومودورو',m:db.set.focus});save();render();
  }
  next();paint();
}
setInterval(()=>{
  if(!pm.run)return;
  pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000));
  if(pm.left===0)finish();else paint();
},250);
$('#pmGo').onclick=toggle;
$('#pmSkip').onclick=()=>{next();paint()};
$('#pmReset').onclick=()=>{pm.run=false;pm.left=dur(pm.mode);paint()};
[['sFocus','focus'],['sBrk','brk'],['sLong','long'],['sEvery','every']].forEach(([id,key])=>{
  const el=$('#'+id);el.value=db.set[key];
  el.onchange=()=>{db.set[key]=Math.max(1,+el.value||1);el.value=db.set[key];save();if(!pm.run){pm.left=dur(pm.mode);paint()}};
});

/* ---------- backup ---------- */
$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
  a.download='planner-backup-'+iso(nowD())+'.json';a.click();
};
$('#imp').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.days)throw 0;db=d;db.set=Object.assign({focus:25,brk:5,long:15,every:4,wg:20,mg:80},db.set||{});save();location.reload()}catch(x){alert('فایل پشتیبان معتبر نیست.')}};
  r.readAsText(f);
};

paint();render();
</script>
